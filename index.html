<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jan Aushadhi - Premium Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        :root { --brand: #4f46e5; --brand-light: #f0f4ff; --bg: #f8fafc; --text: #0f172a; --text-light: #64748b; --glass: rgba(255, 255, 255, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* Tab Visibility */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header & Search */
        header { padding: 20px 0; }
        .logo-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .logo-icon { width: 45px; height: 45px; background: var(--brand); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; transform: rotate(3deg); }
        .search-box { display: flex; align-items: center; gap: 10px; padding: 5px 15px; margin-bottom: 20px; }
        .search-box input { flex: 1; border: none; background: transparent; padding: 15px 0; font-size: 17px; outline: none; }

        /* Cards */
        .med-card { display: flex; align-items: center; gap: 15px; padding: 18px; margin-bottom: 12px; cursor: pointer; position: relative; }
        .med-icon { width: 50px; height: 50px; background: var(--brand-light); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
        .med-info { flex: 1; min-width: 0; }
        .med-info h3 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .med-info p { font-size: 10px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        .fav-btn { padding: 8px; color: #cbd5e1; transition: 0.2s; }
        .fav-btn.active { color: #f43f5e; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 70px; display: flex; justify-content: space-around; align-items: center; z-index: 100; max-width: 560px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-light); text-decoration: none; font-size: 10px; font-weight: 700; transition: 0.3s; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--brand); }
        .nav-item svg { width: 22px; height: 22px; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 35px 35px 0 0; padding: 35px 25px; transform: translateY(100%); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        /* Category Chips */
        .cat-chip { padding: 10px 18px; background: white; border: 1px solid #e2e8f0; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; margin: 4px; display: inline-block; }
        .cat-chip.active { background: var(--brand); color: white; border-color: var(--brand); }

        /* Reminder Item */
        .reminder-item { display: flex; align-items: center; justify-content: space-between; padding: 20px; margin-bottom: 10px; }
        .rem-time { font-size: 18px; font-weight: 800; color: var(--brand); }
        .delete-btn { color: #f43f5e; background: #fff1f2; border: none; padding: 8px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <div style="display:flex; align-items:center; gap:12px">
                    <div class="logo-icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg></div>
                    <div><h1 style="font-size:20px; font-weight:800">Jan Aushadhi</h1><p style="font-size:9px; font-weight:800; color:var(--brand); text-transform:uppercase">By Vaseem Akaram</p></div>
                </div>
                <button onclick="openInfo()" style="background:white; border:1px solid #e2e8f0; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer"><svg viewBox="0 0 24 24" width="18" height="18" stroke="#94a3b8" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button>
            </div>
            <div class="glass search-box">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="#94a3b8" stroke-width="3" fill="none"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                <input type="text" id="searchInput" placeholder="Search medicines..." oninput="filter()">
            </div>
        </header>

        <!-- Tabs -->
        <div id="homeTab" class="tab-content active">
            <div id="medicineList"></div>
            <div style="margin-top:30px"><p style="font-size:10px; font-weight:800; color:var(--text-light); margin-bottom:12px; text-transform:uppercase">Categories</p><div id="categoryList"></div></div>
        </div>

        <div id="recentTab" class="tab-content">
            <h2 style="font-size:14px; margin-bottom:20px; color:var(--text-light)">RECENTLY VIEWED</h2>
            <div id="recentList"></div>
        </div>

        <div id="savedTab" class="tab-content">
            <h2 style="font-size:14px; margin-bottom:20px; color:var(--text-light)">SAVED MEDICINES</h2>
            <div id="savedList"></div>
        </div>

        <div id="remindersTab" class="tab-content">
            <h2 style="font-size:14px; margin-bottom:20px; color:var(--text-light)">MY REMINDERS</h2>
            <div id="remindersList"></div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="glass">
        <button onclick="switchTab('home')" class="nav-item active" id="nav-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></button>
        <button onclick="switchTab('recent')" class="nav-item" id="nav-recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="9"></circle></svg><span>Recent</span></button>
        <button onclick="switchTab('saved')" class="nav-item" id="nav-saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg><span>Saved</span></button>
        <button onclick="switchTab('reminders')" class="nav-item" id="nav-reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span>Alerts</span></button>
    </nav>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()" id="modalContent">
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let MEDICINES_DATA = [];
        let activeCategory = 'All';
        let favorites = JSON.parse(localStorage.getItem('jan_favs') || '[]');
        let recentlyViewed = JSON.parse(localStorage.getItem('jan_viewed') || '[]');
        let reminders = JSON.parse(localStorage.getItem('jan_reminders') || '[]');

        async function loadData() {
            try {
                const response = await fetch('medicines.json');
                const json = await response.json();
                MEDICINES_DATA = json.data.slice(1).map(item => ({
                    drug_code: String(item.A || ''),
                    drug_name: String(item.B || ''),
                    unit_size: String(item.C || ''),
                    mrp: String(item.D || '0'),
                    category: String(item.E || 'General')
                }));
                renderAll();
            } catch (e) {
                document.getElementById('medicineList').innerHTML = '<div style="text-align:center;padding:50px;color:red;font-weight:700">Error: medicines.json not found!</div>';
            }
        }

        function renderMedicines(data, targetId) {
            const list = document.getElementById(targetId);
            list.innerHTML = data.length ? '' : '<div style="text-align:center;padding:50px;color:#94a3b8">No items found.</div>';
            data.slice(0, 50).forEach(med => {
                const isFav = favorites.includes(med.drug_code);
                const div = document.createElement('div');
                div.className = 'glass med-card';
                div.onclick = () => openDetail(med);
                div.innerHTML = `
                    <div class="med-icon"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path></svg></div>
                    <div class="med-info"><h3>${med.drug_name}</h3><p>${med.category}</p></div>
                    <div style="display:flex;align-items:center;gap:10px">
                        <div class="med-price"><div style="font-weight:800">₹${med.mrp}</div><p style="font-size:9px;color:#94a3b8">${med.unit_size}</p></div>
                        <button onclick="toggleFav(event, '${med.drug_code}')" class="fav-btn ${isFav ? 'active' : ''}"><svg viewBox="0 0 24 24" width="20" height="20" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></button>
                    </div>`;
                list.appendChild(div);
            });
        }

        function renderReminders() {
            const list = document.getElementById('remindersList');
            list.innerHTML = reminders.length ? '' : '<div style="text-align:center;padding:50px;color:#94a3b8">No reminders set.</div>';
            reminders.forEach((rem, idx) => {
                const div = document.createElement('div');
                div.className = 'glass reminder-item';
                div.innerHTML = `<div><p style="font-size:13px;font-weight:700">${rem.drug_name}</p><p class="rem-time">${rem.time}</p></div><button onclick="deleteReminder(${idx})" class="delete-btn"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;
                list.appendChild(div);
            });
        }

        function renderCategories() {
            const cats = ['All', ...new Set(MEDICINES_DATA.map(m => m.category))];
            const list = document.getElementById('categoryList');
            list.innerHTML = '';
            cats.slice(0, 15).forEach(cat => {
                const chip = document.createElement('div');
                chip.className = `cat-chip ${activeCategory === cat ? 'active' : ''}`;
                chip.innerText = cat;
                chip.onclick = () => { activeCategory = cat; renderCategories(); filter(); };
                list.appendChild(chip);
            });
        }

        function filter() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = MEDICINES_DATA.filter(m => (m.drug_name.toLowerCase().includes(term) || m.drug_code.includes(term)) && (activeCategory === 'All' || m.category === activeCategory));
            renderMedicines(filtered, 'medicineList');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId + 'Tab').classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            if(tabId === 'saved') renderMedicines(MEDICINES_DATA.filter(m => favorites.includes(m.drug_code)), 'savedList');
            if(tabId === 'recent') renderMedicines(recentlyViewed, 'recentList');
            if(tabId === 'reminders') renderReminders();
        }

        function toggleFav(e, code) {
            e.stopPropagation();
            if(favorites.includes(code)) favorites = favorites.filter(f => f !== code);
            else favorites.push(code);
            localStorage.setItem('jan_favs', JSON.stringify(favorites));
            filter();
            if(document.getElementById('savedTab').classList.contains('active')) switchTab('saved');
        }

        function openDetail(med) {
            recentlyViewed = [med, ...recentlyViewed.filter(m => m.drug_code !== med.drug_code)].slice(0, 10);
            localStorage.setItem('jan_viewed', JSON.stringify(recentlyViewed));
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align:center;margin-bottom:25px"><h2 style="font-size:22px;font-weight:800">${med.drug_name}</h2><p style="color:var(--brand);font-weight:700;font-size:12px;text-transform:uppercase">${med.category}</p></div>
                <div style="background:#0f172a;color:white;padding:30px;border-radius:30px;text-align:center;margin-bottom:25px"><p style="font-size:10px;opacity:0.6;font-weight:800;letter-spacing:1px">PRICE</p><p style="font-size:38px;font-weight:800">₹${med.mrp}</p><p style="font-size:12px;opacity:0.6">${med.unit_size}</p></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
                    <button onclick="openReminderForm('${med.drug_name}')" style="background:var(--brand-light);color:var(--brand);border:none;padding:18px;border-radius:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path></svg> Remind</button>
                    <button onclick="closeModal()" style="background:#f1f5f9;color:#475569;border:none;padding:18px;border-radius:18px;font-weight:700">Close</button>
                </div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function openReminderForm(name) {
            document.getElementById('modalBody').innerHTML = `
                <h3 style="font-weight:800;margin-bottom:20px">Set Dose Reminder</h3>
                <p style="font-size:13px;color:var(--text-light);margin-bottom:15px">${name}</p>
                <input type="time" id="remTime" value="09:00" style="width:100%;padding:20px;border-radius:20px;border:2px solid var(--brand-light);font-size:24px;font-weight:800;text-align:center;margin-bottom:20px;outline:none">
                <button onclick="saveReminder('${name}')" style="width:100%;background:var(--brand);color:white;border:none;padding:20px;border-radius:20px;font-weight:700;font-size:16px">Save Reminder</button>`;
        }

        function saveReminder(name) {
            const time = document.getElementById('remTime').value;
            reminders.push({ drug_name: name, time });
            localStorage.setItem('jan_reminders', JSON.stringify(reminders));
            closeModal();
            switchTab('reminders');
        }

        function deleteReminder(idx) {
            reminders.splice(idx, 1);
            localStorage.setItem('jan_reminders', JSON.stringify(reminders));
            renderReminders();
        }

        function openInfo() {
            document.getElementById('modalBody').innerHTML = `<div style="text-align:center"><div style="width:70px;height:70px;background:var(--brand-light);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--brand);margin:0 auto 20px"><svg viewBox="0 0 24 24" width="35" height="35" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></div><h2 style="font-weight:800;margin-bottom:10px">Jan Aushadhi App</h2><p style="font-size:14px;color:var(--text-light);line-height:1.6;margin-bottom:25px">Find affordable generic medicines easily. Developed for public welfare by <b>Vaseem Akaram</b>. Works 100% offline.</p><button onclick="closeModal()" style="width:100%;background:var(--text);color:white;border:none;padding:18px;border-radius:18px;font-weight:700">Got it</button></div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        function renderAll() { renderCategories(); filter(); }

        loadData();
    </script>
</body>
</html>
